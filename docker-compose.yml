version: "3.9"

services:

  # ── MongoDB replica set (3 nodes) ──────────────────────────────────────────
  mongo1:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports: ["27017:27017"]
    volumes: [mongo1_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo2:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes: [mongo2_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo3:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes: [mongo3_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -e
        if mongosh --quiet --host mongo1 --eval "rs.status().ok" 2>/dev/null | grep -q '^1'; then
          echo "replica set already initialized"; exit 0
        fi
        mongosh --host mongo1 --eval '
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo1:27017", priority: 2 },
              { _id: 1, host: "mongo2:27017", priority: 1 },
              { _id: 2, host: "mongo3:27017", priority: 1 }
            ]
          })'
        echo "waiting for primary..."
        for i in $(seq 1 60); do
          state=$(mongosh --quiet --host mongo1 --eval "rs.status().myState" 2>/dev/null | tr -d '[:space:]')
          [ "$state" = "1" ] && echo "PRIMARY OK" && exit 0
          sleep 3
        done
        echo "primary not elected in time"; exit 1

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Manager ────────────────────────────────────────────────────────────────
  manager:
    build:
      context: ./manager
    ports: ["8080:8080"]
    environment:
      MONGO_URI: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
      MONGO_DB: crack
      HTTP_PORT: "8080"
      CHUNK_SIZE: "100000"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_VHOST: "/"
      TASK_QUEUE: task.queue
      RESULT_QUEUE: result.queue
      HEARTBEAT: "30"
      RETRY_INTERVAL_SEC: "10"
      REQUEST_TIMEOUT_SEC: "300"
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo1:   { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      retries: 10

  # ── Workers ────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
    deploy:
      replicas: 2
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_VHOST: "/"
      TASK_QUEUE: task.queue
      RESULT_QUEUE: result.queue
      PREFETCH: "1"
      HEARTBEAT: "30"
      OMP_NUM_THREADS: "2"
      METRICS_PORT: "9090"
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: on-failure

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
