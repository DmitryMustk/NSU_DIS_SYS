---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-conf
  namespace: crack
data:
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  TASK_QUEUE: "task.queue"
  RESULT_QUEUE: "result.queue"
  PREFETCH: "1"
  HEARTBEAT: "30"
  OMP_NUM_THREADS: "2"
  METRICS_PORT: "9090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: crack
spec:
  replicas: 2          # configurable; can be scaled with `kubectl scale`
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: crack/worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 9090, name: metrics }
          envFrom:
            - configMapRef: { name: worker-conf }
          env:
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-creds, key: username } }
            - name: RABBITMQ_PASS
              valueFrom: { secretKeyRef: { name: rabbitmq-creds, key: password } }
          resources:
            requests: { cpu: 200m, memory: 64Mi }
            limits:   { cpu: "2",  memory: 256Mi }
---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: crack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
