---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: crack
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command:
            - bash
            - -c
            - |
              set -e
              hosts=(mongodb-0.mongodb mongodb-1.mongodb mongodb-2.mongodb)
              echo "waiting for all mongo pods..."
              for h in "${hosts[@]}"; do
                until mongosh --quiet --host "$h" --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                  echo "  $h not ready, sleep 3s"; sleep 3
                done
                echo "  $h up"
              done
              echo "checking rs status on mongodb-0..."
              if mongosh --quiet --host mongodb-0.mongodb --eval "rs.status().ok" 2>/dev/null | grep -q '^1'; then
                echo "replica set already initialized"
                exit 0
              fi
              echo "initiating replica set rs0..."
              mongosh --host mongodb-0.mongodb --eval '
                rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongodb-0.mongodb:27017", priority: 2 },
                    { _id: 1, host: "mongodb-1.mongodb:27017", priority: 1 },
                    { _id: 2, host: "mongodb-2.mongodb:27017", priority: 1 }
                  ]
                })
              '
              echo "waiting for primary election..."
              for i in $(seq 1 60); do
                state=$(mongosh --quiet --host mongodb-0.mongodb --eval "rs.status().myState" || echo 0)
                if [ "$state" = "1" ]; then echo "mongodb-0 is PRIMARY"; exit 0; fi
                sleep 2
              done
              echo "primary not elected in time"; exit 1
