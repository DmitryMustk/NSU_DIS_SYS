---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manager-conf
  namespace: crack
data:
  MONGO_URI: "mongodb://mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/?replicaSet=rs0"
  MONGO_DB: "crack"
  HTTP_PORT: "8080"
  CHUNK_SIZE: "100000"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  TASK_QUEUE: "task.queue"
  RESULT_QUEUE: "result.queue"
  HEARTBEAT: "30"
  RETRY_INTERVAL_SEC: "10"
  REQUEST_TIMEOUT_SEC: "300"
---
apiVersion: v1
kind: Service
metadata:
  name: manager
  namespace: crack
  labels: { app: manager }
spec:
  selector: { app: manager }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: manager-external
  namespace: crack
  labels: { app: manager }
spec:
  type: NodePort
  selector: { app: manager }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 30080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: crack
spec:
  replicas: 1
  selector: { matchLabels: { app: manager } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: manager }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        - name: manager
          image: crack/manager:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: manager-conf }
          env:
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-creds, key: username } }
            - name: RABBITMQ_PASS
              valueFrom: { secretKeyRef: { name: rabbitmq-creds, key: password } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 512Mi }
